services:
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
  panel:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    environment:
      API_BASE_URL: http://api:8000
      DASHBOARD_API_KEY: ${DASHBOARD_API_KEY:-}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
    ports: ["8501:8501"]
    depends_on: [api]
